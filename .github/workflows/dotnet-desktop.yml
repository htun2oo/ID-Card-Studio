name: Build .NET 9 WPF App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@main
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore IDWorksEnterpriseDesigner/IDWorksEnterpriseDesigner.csproj

    - name: Publish Desktop App
      run: dotnet publish IDWorksEnterpriseDesigner/IDWorksEnterpriseDesigner.csproj -c Release -r win-x64 --self-contained true -o ./publish

    # Self-Signed Certificate ဖန်တီးပြီး Executable (.exe) ကို Sign ပြုလုပ်ခြင်း
    - name: Sign Executable File
      shell: pwsh
      run: |
        # Certificate ဖန်တီးခြင်း
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=IDWorksEnterprise" -CertStoreLocation cert:\CurrentUser\My

        # Local Certificate Store သို့ ထည့်သွင်းခြင်း
        $certStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "CurrentUser")
        $certStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
        $certStore.Add($cert)
        $certStore.Close()

        # Timestamp Server မပါဘဲ အော့ဖ်လိုင်း လက်မှတ်ထိုးခြင်း (Publish လုပ်ထားသော Path ကို သေချာညွှန်ပေးခြင်း)
        Set-AuthenticodeSignature -FilePath "./publish/IDWorksEnterpriseDesigner.exe" -Certificate $cert

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@main
      with:
        name: IDWorksEnterpriseDesigner-Windows-x64
        path: ./publish
