name: Build .NET 10 WPF App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@main
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore IDCardStudio/IDCardStudio.csproj

    - name: Publish Desktop App
      run: dotnet publish IDCardStudio/IDCardStudio.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Create Self-Signed Certificate and Sign Executable
      shell: pwsh
      run: |
        # GitHub Actions Runner ထဲတွင် ယာယီ Certificate တစ်ခု ဖန်တီးခြင်း
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=IDCardStudio" -CertStoreLocation Cert:\CurrentUser\My
        
        # ထွက်လာမည့် .exe ဖိုင်ကို လက်မှတ်ထိုးခြင်း
        $targetExe = "./publish/IDCardStudio.exe"
        Set-AuthenticodeSignature -FilePath $targetExe -Certificate $cert
        
        Write-Host "Application successfully signed with self-signed certificate!"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@main
      with:
        name: IDCardStudio-Windows-x64
        path: ./publish
