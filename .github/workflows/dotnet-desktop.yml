name: Build .NET 9 WPF App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore IDWorksEnterpriseDesigner/IDWorksEnterpriseDesigner.csproj

    # Windows x64 အတွက် Standalone App (.exe) ထွက်ရှိအောင် Publish လုပ်ခြင်း
    - name: Publish Desktop App
      run: dotnet publish IDWorksEnterpriseDesigner/IDWorksEnterpriseDesigner.csproj -c Release -r win-x64 --self-contained true -o ./publish

    # ထွက်လာသော Build Files များကို Artifact အဖြစ် Upload ပြုလုပ်ခြင်း
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: IDWorksEnterpriseDesigner-Windows-x64
        path: ./publish
