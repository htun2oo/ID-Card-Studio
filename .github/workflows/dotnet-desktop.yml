name: Build .NET 9 WPF App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore IDWorksEnterpriseDesigner/IDWorksEnterpriseDesigner.csproj

    - name: Build project
      run: dotnet build IDWorksEnterpriseDesigner/IDWorksEnterpriseDesigner.csproj --configuration Release --no-restore
